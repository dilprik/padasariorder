<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRANKAS Terbuka — Mockup Mobile (390 × 844 px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0E3B2E;
      --primary-2: #145A43;
      --ink: #10201A;
      --muted: #5E6B64;
      --bg: #F4F6F3;
      --surface: #FFFFFF;
      --border: #E3E8E4;
      --tint: #E3F4EA;
      --gold: #C9952B;
      --gold-ink: #8A5A00;
      --gold-light: #E9C877;
      --gold-soft: #FFF4DB;
      --success: #0F7A4B;
      --danger: #B42318;
      --danger-bg: #FDECEC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #E8ECE9;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.45;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Kanvas Ponsel 390 × 844 px */
    .phone-shell {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border-radius: 40px;
      border: 8px solid #16221D;
      box-shadow: 0 24px 60px rgba(14, 59, 46, 0.22);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Status Bar 44 px */
    .status-bar {
      height: 44px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      z-index: 20;
    }

    .status-bar.light-bar {
      background: var(--bg);
      color: var(--ink);
    }

    .island-switcher {
      background: #10201A;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }

    .status-bar.light-bar .island-switcher {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* Viewport Konten */
    .phone-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 88px;
      scrollbar-width: none;
    }

    .phone-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Header Hijau */
    .screen-header-dark {
      background: var(--primary);
      color: #FFFFFF;
      padding: 8px 16px 24px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
    }

    .screen-header-light {
      padding: 12px 16px 8px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn.on-dark {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    .icon-btn.on-light {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
    }

    /* Tipografi Sesuai Spesifikasi */
    .title-screen {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .title-card {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .text-body {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
    }

    .text-caption {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.4;
    }

    .num-hero {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    /* Stack & Kartu */
    .content-stack {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(16, 32, 26, 0.03);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-hero {
      background: var(--primary);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 6px 18px rgba(14, 59, 46, 0.14);
    }

    .card-hero-2 {
      background: var(--primary-2);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sub-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .alert-warning {
      background: var(--gold-soft);
      border: 1px solid var(--gold-light);
      color: var(--gold-ink);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    .alert-danger {
      background: var(--danger-bg);
      border: 1px solid #F5C2BE;
      color: var(--danger);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    .alert-tint {
      background: var(--tint);
      border: 1px solid #C2E5D1;
      color: var(--primary);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    /* Tombol & Chip (Target Sentuh >= 44 px) */
    .btn-gold-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .btn-gold-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-outline-primary {
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--primary);
      background: var(--surface);
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-neutral {
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-text {
      min-height: 44px;
      padding: 8px 4px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip-pill {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .chip-pill.selected {
      background: var(--tint);
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    .chip-pill.disabled-slot {
      background: #ECEFED;
      color: #8A9690;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    /* Label Pil */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .badge-success {
      background: var(--tint);
      color: var(--success);
    }

    .badge-gold {
      background: var(--gold-soft);
      color: var(--gold-ink);
    }

    .badge-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .badge-neutral {
      background: #ECEFED;
      color: var(--muted);
    }

    .badge-dark-glass {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    /* Input & Select */
    .input-field {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      color: var(--ink);
    }

    .input-field:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    /* Progress Bar */
    .bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #E6EBE8;
      overflow: hidden;
    }

    .bar-fill-primary {
      height: 100%;
      border-radius: 999px;
      background: var(--primary);
    }

    .bar-fill-gold {
      height: 100%;
      border-radius: 999px;
      background: var(--gold);
    }

    .bar-fill-success {
      height: 100%;
      border-radius: 999px;
      background: var(--success);
    }

    /* Stepper Horizontal 3 Langkah */
    .h-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .h-step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .h-step.active {
      color: var(--primary);
    }

    .h-step-dot {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .h-step.active .h-step-dot {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    /* Stepper Vertikal */
    .v-step-row {
      display: flex;
      gap: 12px;
      position: relative;
    }

    .v-step-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 24px;
      flex-shrink: 0;
    }

    .v-step-circle {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
    }

    .v-step-circle.done {
      background: var(--success);
      border-color: var(--success);
      color: #FFFFFF;
    }

    .v-step-circle.active {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold-ink);
    }

    .v-step-circle.warn {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold-ink);
    }

    .v-step-line {
      width: 2px;
      flex: 1;
      min-height: 16px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Navigasi Bawah 4 Menu */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px 10px;
      z-index: 25;
    }

    .bnav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 48px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .bnav-btn.active {
      color: var(--primary);
      font-weight: 700;
      background: var(--tint);
    }

    /* Bottom Sheet & Drawer di dalam Ponsel */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 32, 26, 0.52);
      z-index: 40;
      display: none;
      align-items: flex-end;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet-panel {
      width: 100%;
      max-height: 82%;
      overflow-y: auto;
      background: var(--surface);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast-banner {
      position: absolute;
      top: 52px;
      left: 16px;
      right: 16px;
      background: var(--ink);
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      z-index: 50;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .toast-banner.show {
      display: block;
    }

    .illustration-footer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0 8px;
    }

    /* Tampilan Khusus N13 Desktop KPI (1440 × 900) */
    .desktop-kpi-wrap {
      display: none;
      width: 100%;
      max-width: 1360px;
      background: var(--bg);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(14, 59, 46, 0.14);
    }

    @media (max-width: 420px) {
      body {
        padding: 0;
        background: var(--bg);
      }
      .phone-shell {
        width: 100vw;
        height: 100dvh;
        border: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <!-- KANVAS PONSEL UTAMA (390 × 844 px) -->
  <div class="phone-shell" id="phoneContainer">
    <!-- Status Bar 44 px -->
    <div class="status-bar" id="phoneStatusBar">
      <span class="tabular">09.00</span>
      <button type="button" class="island-switcher" onclick="openScreenSwitcher()" title="Pilih layar (19 layar)">
        <span id="islandScreenLabel">N1 · Beranda</span>
        <span>▾</span>
      </button>
      <span style="display:inline-flex; align-items:center; gap:5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg width="16" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
      </span>
    </div>

    <!-- Toast Notifikasi -->
    <div class="toast-banner" id="toastBanner"></div>

    <!-- Area Konten Layar -->
    <main class="phone-viewport" id="phoneViewport"></main>

    <!-- Navigasi Bawah 4 Menu: Brankas · Tujuan · Bukti · Butik -->
    <nav class="bottom-nav" aria-label="Menu utama">
      <button type="button" class="bnav-btn active" data-tab="brankas" onclick="navigateTo('N1')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3"/><line x1="7" y1="8" x2="7.01" y2="8"/></svg>
        <span>Brankas</span>
      </button>
      <button type="button" class="bnav-btn" data-tab="tujuan" onclick="navigateTo('L2')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Tujuan</span>
      </button>
      <button type="button" class="bnav-btn" data-tab="bukti" onclick="navigateTo('L3')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        <span>Bukti</span>
      </button>
      <button type="button" class="bnav-btn" data-tab="butik" onclick="navigateTo('L4')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Butik</span>
      </button>
    </nav>

    <!-- Bottom Sheet Interaktif -->
    <div class="sheet-backdrop" id="sheetBackdrop" onclick="if(event.target===this) closeSheet()">
      <div class="sheet-panel" id="sheetPanel"></div>
    </div>
  </div>

  <!-- KANVAS DESKTOP N13 (KPI INTERNAL 1440 × 900) -->
  <div class="desktop-kpi-wrap" id="desktopKpiContainer"></div>

  <script>
    // Data Acuan Kasus (15 Nov 2026)
    const PRICE_BUY_15NOV = 2517000;
    const PRICE_BUYBACK_15NOV = 2293000;
    const AVG_BUY_PRICE = 2380000;

    // Daftar Seluruh 19 Layar (L1–L6 & N1–N13)
    const SCREEN_LIST = [
      { id: 'N1', code: 'N1', title: 'Beranda Brankas', tab: 'brankas', group: 'Utama & Navigasi', tag: 'Penting' },

      { id: 'N7', code: 'N7', title: 'Beli ulang cepat (Setor lagi)', tab: 'tujuan', group: 'Tabungan & Transaksi', tag: 'Penting' },
      { id: 'N8', code: 'N8', title: 'Atur autodebet (opsional)', tab: 'tujuan', group: 'Tabungan & Transaksi', tag: 'Opsional' },
      { id: 'N9', code: 'N9', title: 'Jual + rincian potongan', tab: 'brankas', group: 'Tabungan & Transaksi', tag: 'Wajib' },
      { id: 'N10', code: 'N10', title: 'Status cetak per tahap', tab: 'butik', group: 'Tabungan & Transaksi', tag: 'Wajib' },

      { id: 'N3', code: 'N3', title: 'Persiapan daftar + asal pelanggan', tab: 'brankas', group: 'Pendaftaran & Keamanan', tag: 'Wajib' },
      { id: 'N2', code: 'N2', title: 'Pilih tipe keanggotaan + biaya efektif', tab: 'brankas', group: 'Pendaftaran & Keamanan', tag: 'Penting' },
      { id: 'L1', code: 'L1', title: 'Status pendaftaran & e-KYC', tab: 'brankas', group: 'Pendaftaran & Keamanan', tag: 'Revisi' },
      { id: 'N4', code: 'N4', title: 'e-KYC ditolak beserta alasannya', tab: 'brankas', group: 'Pendaftaran & Keamanan', tag: 'Wajib' },
      { id: 'L6', code: 'L6', title: 'Pusat Keamanan & Keluarga', tab: 'brankas', group: 'Pendaftaran & Keamanan', tag: 'Revisi' },

      { id: 'N11', code: 'N11', title: 'Mode sederhana (ramah senior)', tab: 'brankas', group: 'Inklusi, Notifikasi & KPI', tag: 'Opsional' },
      { id: 'N12', code: 'N12', title: 'Pusat status / notifikasi', tab: 'brankas', group: 'Inklusi, Notifikasi & KPI', tag: 'Opsional' },
      { id: 'N13', code: 'N13', title: 'Dashboard KPI internal (desktop)', tab: 'brankas', group: 'Inklusi, Notifikasi & KPI', tag: 'Desktop' }
    ];

    // State Aplikasi
    const state = {
      currentScreen: 'N1',
      // L1
      l1QuotaOpen: false,
      l1NotifySaved: false,
      // L2
      goals: [
        { id: 'g1', name: 'Menikah', current: 6.40, target: 10.0, pct: 64, deadline: 'Des 2027', status: 'Sesuai jadwal', badge: 'badge-success' },

    // Utilitas Format Angka Indonesia
    function formatRp(num) {
      const val = Math.round(Number(num) || 0);
      const sign = val < 0 ? '−' : '';
      return sign + 'Rp' + Math.abs(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatGr(num, dec) {
      const d = typeof dec === 'number' ? dec : 2;
      return (Number(num) || 0).toFixed(d).replace('.', ',');
    }

    // Toast & Bottom Sheet
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 2800);
    }

    function openSheet(html) {
      const backdrop = document.getElementById('sheetBackdrop');
      const panel = document.getElementById('sheetPanel');
      if (!backdrop || !panel) return;
      panel.innerHTML = html;
      backdrop.classList.add('open');
    }

      if (backdrop) backdrop.classList.remove('open');

                  <rect x="44" y="44" width="14" height="14" fill="#C9952B"/>
                  <rect x="66" y="46" width="10" height="24" fill="#0E3B2E"/>
                  <rect x="46" y="70" width="26" height="10" fill="#0E3B2E"/>
                </svg>
              </div>
              <div style="font-size:14px; font-weight:700;">Butik Emas LM Jakarta</div>

            </div>
          ` : ''}

          <p class="illustration-footer">Contoh ilustrasi</p>
        </div>
      `;
    }

    // =========================================================================
    // N11 · MODE SEDERHANA (RAMAH PENSIUNAN · HURUF >= 18 PX)
    // =========================================================================
    function openN11HelpSheet() {
      openSheet(`
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:20px; font-weight:700;">Pilih bantuan</span>
          <button type="button" class="icon-btn on-light" onclick="closeSheet()" aria-label="Tutup">✕</button>
        </div>
        <button type="button" class="btn-gold-primary" style="min-height:60px; font-size:18px;"
          onclick="closeSheet(); showToast('Menghubungi ${state.l6FamilyName} (${state.l6FamilyPhone})...');">
          Telepon ${state.l6FamilyName}
        </button>
        <button type="button" class="btn-outline-primary" style="width:100%; min-height:60px; font-size:18px;"
          onclick="closeSheet(); navigateTo('L4');">
          Datang ke butik
        </button>
        <button type="button" class="btn-outline-neutral" style="width:100%; min-height:60px; font-size:18px;"
          onclick="closeSheet(); showToast('Menghubungi layanan resmi ANTAM 1500-088...');">
          Telepon resmi ANTAM
        </button>
      `);
    }

    function renderN11() {
      return `
        <div class="screen-header-dark">
          <div class="topbar-row">
            <h1 style="font-size:24px; font-weight:700;">Mode sederhana</h1>
            <span class="badge-pill badge-dark-glass">Huruf besar</span>
          </div>
        </div>

        <div class="content-stack">
          <div class="card-hero">
            <div style="font-size:20px; font-weight:600; line-height:1.4;">
              Emas Anda <strong>12 gram</strong>. Aman tersimpan di ANTAM.
            </div>
          </div>

          <button type="button" onclick="navigateTo('L3')"
            style="width:100%; height:88px; border-radius:18px; background:var(--surface); border:2px solid var(--primary); color:var(--primary); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px;">
            Lihat emas saya
          </button>

          <button type="button" onclick="navigateTo('N5')"
            style="width:100%; height:88px; border-radius:18px; background:var(--gold); color:var(--ink); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px;">
            Beli emas
          </button>

          <button type="button" onclick="openN11HelpSheet()"
            style="width:100%; height:88px; border-radius:18px; background:var(--surface); border:2px solid var(--border); color:var(--ink); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px;">
            Minta bantuan
          </button>

          <div class="alert-warning" style="font-size:18px; font-weight:600; line-height:1.4;">
            ANTAM tidak pernah meminta PIN atau kode OTP.
          </div>

          <div style="text-align:center; padding-top:4px;">
            <button type="button" class="btn-text" style="font-size:16px;" onclick="navigateTo('N1')">
              Kembali ke tampilan biasa
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // N12 · PUSAT STATUS / NOTIFIKASI
    // =========================================================================
    function renderN12() {
      const items = [
        { cat: 'Proses', title: 'Verifikasi akun selesai · tepat waktu', time: '19 Nov 2026 · 08.45', badge: 'badge-success', status: 'Tepat waktu' },
        { cat: 'Proses', title: 'Dana jual masuk Rp2,4 jt · 1 hari lebih cepat', time: '18 Nov 2026 · 14.20', badge: 'badge-success', status: 'Lebih cepat' },
        { cat: 'Keamanan', title: 'Login dari perangkat baru · Bukan Anda?', time: '17 Nov 2026 · 19.10', badge: 'badge-danger', status: 'Perlu cek' }
      ];
      const filtered = state.n12Tab === 'Semua' ? items : items.filter(i => i.cat === state.n12Tab);

      return `
        <div class="screen-header-dark">
          <div class="topbar-row">
            <button type="button" class="icon-btn on-dark" onclick="navigateTo('N1')" aria-label="Kembali">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h1 class="title-screen">Status &amp; notifikasi</h1>
            <button type="button" class="badge-pill badge-dark-glass" onclick="state.n12EmptyMode=!state.n12EmptyMode; renderApp();">
              ${state.n12EmptyMode ? 'Isi contoh' : 'State kosong'}
            </button>
          </div>
        </div>

        <div class="content-stack">
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
            ${['Semua', 'Proses', 'Keamanan'].map(tb => `
              <button type="button" class="chip-pill ${state.n12Tab === tb ? 'selected' : ''}"
                onclick="state.n12Tab='${tb}'; renderApp();">${tb}</button>
            `).join('')}
          </div>

          ${state.n12EmptyMode ? `
            <div class="card" style="text-align:center; padding:32px 16px;">
              <div class="title-card">Belum ada proses berjalan.</div>
              <p class="text-caption">Semua pembaruan cetak, pencairan dana, dan keamanan akan muncul di sini.</p>
            </div>
          ` : filtered.map(it => `
            <div class="card" onclick="${it.cat === 'Keamanan' ? "navigateTo('L6')" : "navigateTo('N10')"}" style="cursor:pointer;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                <div style="font-size:14px; font-weight:600; color:${it.cat === 'Keamanan' ? 'var(--danger)' : 'var(--ink)'};">
                  ${it.title}
                </div>
                <span class="badge-pill ${it.badge}" style="white-space:nowrap;">${it.status}</span>
              </div>
              <div class="text-caption">${it.time}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // =========================================================================
    // N13 · DASHBOARD KPI INTERNAL (DESKTOP 1440 × 900)
    // =========================================================================
    function renderN13Desktop() {
      const kpis = [
        { label: 'Pendaftar baru', val: '18.420', delta: '+24%' },
        { label: 'Lolos e-KYC %', val: '86,4%', delta: '+18,2%' },
        { label: 'Aktivasi ≤ 7 hari %', val: '64,0%', delta: '+15,0%' },
        { label: 'Setoran ulang 90 hari %', val: '52,8%', delta: '+21,4%' },
        { label: 'Saldo bertahan (ton)', val: '4,82 ton', delta: '+0,64 ton' },
        { label: 'Ketepatan janji waktu %', val: '94,2%', delta: 'Target ≥ 92%' }
      ];

      const funnel = [
        { stage: 'Kesadaran', pct: 100 },
        { stage: 'Mulai daftar', pct: 74 },
        { stage: 'Lolos e-KYC', pct: 64 },
        { stage: 'Beli pertama', pct: 48 },
        { stage: 'Setor ulang', pct: 31 },
        { stage: 'Cetak / Jual', pct: 19 }
      ];

      const gates = [
        { gate: 'G1 · Kesiapan e-KYC & Transparansi', target: 'Lolos e-KYC ≥ 85%', current: '86,4%', status: 'Lolos' },
        { gate: 'G2 · Retensi Setoran Ulang 90 Hari', target: 'Setor ulang ≥ 50%', current: '52,8%', status: 'Lolos' },
        { gate: 'G3 · Ketepatan Janji Cetak & Dana', target: 'Tepat waktu ≥ 95%', current: '94,2%', status: 'Belum' }
      ];

      return `
        <div style="display:grid; grid-template-columns:230px 1fr; min-height:760px;">
          <!-- Sidebar Kiri -->
          <aside style="background:var(--primary); color:#FFFFFF; padding:20px; display:flex; flex-direction:column; justify-content:space-between;">
            <div style="display:flex; flex-direction:column; gap:16px;">
              <div>
                <div style="font-size:11px; color:var(--gold-light); font-weight:700;">MEASURE · INTERNAL</div>
                <div style="font-size:18px; font-weight:700; margin-top:4px;">BRANKAS Terbuka</div>
                <div style="font-size:12px; color:rgba(255,255,255,0.75);">KPI 2027 (Data simulasi)</div>
              </div>
              <div style="display:flex; flex-direction:column; gap:6px; font-size:13px;">
                <div style="padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.14); font-weight:600;">Ringkasan Eksekutif</div>
                <div style="padding:10px 12px; color:rgba(255,255,255,0.75);">Corong Pendaftaran</div>
                <div style="padding:10px 12px; color:rgba(255,255,255,0.75);">Retensi Kohort</div>
                <div style="padding:10px 12px; color:rgba(255,255,255,0.75);">Gerbang Keputusan G1–G3</div>
              </div>
            </div>
            <button type="button" class="btn-gold-primary" onclick="navigateTo('N1')">
              ← Kembali ke Mockup Mobile
            </button>
          </aside>

          <!-- Area Utama -->
          <div style="padding:24px; display:flex; flex-direction:column; gap:18px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div>
                <h1 class="title-screen">BRANKAS Terbuka · KPI 2027</h1>
                <span class="text-caption">Data simulasi untuk evaluasi pilot 3 kota vs pembanding</span>
              </div>
              <div style="display:flex; gap:8px;">
                <span class="chip-pill selected">Periode: Q1–Q2 2027</span>
                <span class="chip-pill">Kanal: Semua</span>
                <span class="chip-pill">Kota Pilot vs Pembanding</span>
              </div>
            </div>

            <!-- Baris 1: 6 Kartu KPI -->
            <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:12px;">
              ${kpis.map(k => `
                <div class="card" style="padding:14px;">
                  <div class="text-caption">${k.label}</div>
                  <div class="tabular" style="font-size:20px; font-weight:700; color:var(--primary);">${k.val}</div>
                  <span class="badge-pill badge-success" style="align-self:flex-start;">${k.delta}</span>
                </div>
              `).join('')}
            </div>

            <!-- Baris 2: Funnel Horizontal & Asal Pelanggan -->
            <div style="display:grid; grid-template-columns:1.5fr 1fr; gap:16px;">
              <div class="card">
                <h2 class="title-card">Funnel 6 tahap (Kesadaran → Cetak/Jual)</h2>
                ${funnel.map(f => `
                  <div style="display:grid; grid-template-columns:120px 1fr 48px; align-items:center; gap:10px; font-size:12px;">
                    <span>${f.stage}</span>
                    <div class="bar-track"><div class="bar-fill-primary" style="width:${f.pct}%;"></div></div>
                    <strong class="tabular" style="text-align:right;">${f.pct}%</strong>
                  </div>
                `).join('')}
              </div>

              <div class="card">
                <h2 class="title-card">Asal pelanggan</h2>
                <div class="sub-box" style="display:flex; flex-direction:column; gap:8px; font-size:13px;">
                  <div style="display:flex; justify-content:space-between;"><span>Nasabah baru digital</span><strong>52%</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Pindahan pembeli butik</span><strong>31%</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Migrasi akun lama</span><strong>17%</strong></div>
                </div>
                <span class="text-caption">Data simulasi · Survei 1 ketuk saat pendaftaran (N3)</span>
              </div>
            </div>

            <!-- Baris 3 & 4: Retensi & Tabel Gerbang G1–G3 -->
            <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:16px;">
              <div class="card">
                <h2 class="title-card">Setoran ulang: Kota Pilot vs Pembanding</h2>
                <div class="sub-box" style="display:flex; flex-direction:column; gap:8px; font-size:13px;">
                  <div><strong>Kota Pilot (M0 → M6):</strong> 100% → 72% → 61% → 53%</div>
                  <div><strong>Kota Pembanding (M0 → M6):</strong> 100% → 51% → 38% → 31%</div>
                </div>
                <span class="text-caption">Data simulasi</span>
              </div>

              <div class="card">
                <h2 class="title-card">Tabel gerbang keputusan G1–G3</h2>
                <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:left;">
                  <thead>
                    <tr style="border-bottom:1px solid var(--border); color:var(--muted);">
                      <th style="padding:6px 4px;">Gerbang</th>
                      <th style="padding:6px 4px;">Target</th>
                      <th style="padding:6px 4px;">Saat ini</th>
                      <th style="padding:6px 4px;">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${gates.map(g => `
                      <tr style="border-bottom:1px solid var(--border);">
                        <td style="padding:8px 4px; font-weight:600;">${g.gate}</td>
                        <td style="padding:8px 4px;">${g.target}</td>
                        <td style="padding:8px 4px;" class="tabular"><strong>${g.current}</strong></td>
                        <td style="padding:8px 4px;">
                          <span class="badge-pill ${g.status === 'Lolos' ? 'badge-success' : 'badge-gold'}">${g.status}</span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                <span class="text-caption">Data simulasi</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // RENDERER UTAMA & NAVIGASI
    // =========================================================================
    function renderApp() {
      try {
        const phoneContainer = document.getElementById('phoneContainer');
        const desktopContainer = document.getElementById('desktopKpiContainer');
        const viewport = document.getElementById('phoneViewport');
        const statusBar = document.getElementById('phoneStatusBar');
        const islandLabel = document.getElementById('islandScreenLabel');
        const screenMeta = SCREEN_LIST.find(s => s.id === state.currentScreen) || SCREEN_LIST[0];

        if (state.currentScreen === 'N13') {
          if (phoneContainer) phoneContainer.style.display = 'none';
          if (desktopContainer) {
            desktopContainer.style.display = 'block';
            desktopContainer.innerHTML = renderN13Desktop();
          }
          return;
        }

        if (phoneContainer) phoneContainer.style.display = 'flex';
        if (desktopContainer) desktopContainer.style.display = 'none';

        if (islandLabel) {
          islandLabel.textContent = screenMeta.code + ' · ' + screenMeta.title.split(' ')[0];
        }

        const lightHeaderScreens = ['N4', 'N6'];
        if (statusBar) {
          if (lightHeaderScreens.includes(state.currentScreen)) {
            statusBar.classList.add('light-bar');
          } else {
            statusBar.classList.remove('light-bar');
          }
        }

        document.querySelectorAll('.bnav-btn').forEach(btn => {
          if (btn.getAttribute('data-tab') === screenMeta.tab) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        const renderers = {
          L1: renderL1,
          L2: renderL2,
          L3: renderL3,
          L4: renderL4,
          L5: renderL5,
          L6: renderL6,
          N1: renderN1,
          N2: renderN2,
          N3: renderN3,
          N4: renderN4,
          N5: renderN5,
          N6: renderN6,
          N7: renderN7,
          N8: renderN8,
          N9: renderN9,
          N10: renderN10,
          N11: renderN11,
          N12: renderN12
        };

        const fn = renderers[state.currentScreen] || renderN1;
        if (viewport) {
          viewport.innerHTML = fn();
        }
      } catch (err) {
        console.error('Error renderApp:', err);
        const viewport = document.getElementById('phoneViewport');
        if (viewport) {
          viewport.innerHTML = '<div class="content-stack"><div class="card"><div class="title-card">Memuat ulang tampilan</div><button type="button" class="btn-gold-primary" onclick="navigateTo(\'N1\')">Kembali ke Beranda</button></div></div>';
        }
      }
    }

    function navigateTo(screenId) {
      state.currentScreen = screenId;
      const viewport = document.getElementById('phoneViewport');
      if (viewport) viewport.scrollTop = 0;
      renderApp();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    } else {
      renderApp();
    }
    window.onload = renderApp;
  </script>
</body>
</html>
